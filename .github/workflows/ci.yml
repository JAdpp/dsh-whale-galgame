name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check committed art and bundles
        shell: pwsh
        run: |
          git diff --exit-code -- assets/default src/client/art.generated.ts lib
          $changes = git status --porcelain --untracked-files=all -- assets/default src/client/art.generated.ts lib
          if ($changes) {
            $changes
            exit 1
          }
