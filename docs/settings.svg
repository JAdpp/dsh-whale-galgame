<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Plugin settings preview</title><desc id="desc">A privacy-safe vector mockup of the DSH plugin settings card.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152f"/><stop offset="1" stop-color="#153458"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".3"/></filter></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><g opacity=".12" stroke="#b7e7ff"><path d="M0 110H1200M0 560H1200M160 0V675M1040 0V675"/></g>
  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect x="168" y="55" width="864" height="565" rx="26" fill="#eff4f8" fill-opacity=".96"/>
    <text x="212" y="105" fill="#172b42" font-size="25" font-weight="700">Plugins</text><text x="212" y="132" fill="#6e7f91" font-size="13">Configure installed extensions for this DSH Web deployment.</text>
    <path d="M212 158H988" stroke="#c8d4de"/>
    <g transform="translate(212 185)">
      <rect width="776" height="362" rx="18" fill="#fff" stroke="#b8cbd9"/>
      <rect width="776" height="82" rx="18" fill="#e9f1f7"/><path d="M0 82H776" stroke="#b8cbd9"/>
      <text x="24" y="34" fill="#122b45" font-size="18" font-weight="700">Whale Galgame</text><text x="24" y="58" fill="#6a7f91" font-size="12">Character, dialogue model and local visual customization.</text>
      <rect x="660" y="24" width="88" height="34" rx="17" fill="#d8f1ea" stroke="#5ba98f"/><text x="682" y="46" fill="#266851" font-size="12" font-weight="700">ENABLED</text>
      <g font-size="14"><text x="24" y="123" fill="#23384a" font-weight="700">Plugin</text><text x="24" y="146" fill="#7a8d9d" font-size="11">Hide the pet and pause Galgame when disabled.</text></g>
      <rect x="650" y="105" width="98" height="38" rx="19" fill="#0d7c68"/><circle cx="729" cy="124" r="14" fill="#fff"/><text x="666" y="129" fill="#fff" font-size="11">ON</text>
      <g transform="translate(24 170)"><text y="16" fill="#23384a" font-size="14" font-weight="700">Character source</text><text y="38" fill="#7a8d9d" font-size="11">Follow the workspace model or pin one role.</text><rect x="420" width="328" height="46" rx="10" fill="#f3f7fa" stroke="#b5c7d4"/><text x="440" y="29" fill="#264158" font-size="13">Follow workspace · DeepSeek</text><path d="M720 20l8 8 8-8" fill="none" stroke="#57758c"/></g>
      <g transform="translate(24 235)"><text y="16" fill="#23384a" font-size="14" font-weight="700">Dialogue model</text><text y="38" fill="#7a8d9d" font-size="11">Default Flash, workspace route, or any live model.</text><rect x="420" width="328" height="46" rx="10" fill="#f3f7fa" stroke="#b5c7d4"/><text x="440" y="29" fill="#264158" font-size="13">Plugin default · deepseek-v4-flash</text><path d="M720 20l8 8 8-8" fill="none" stroke="#57758c"/></g>
      <g transform="translate(24 306)"><rect width="218" height="36" rx="10" fill="#153d60"/><text x="37" y="23" fill="#e7f6ff" font-size="12">UPLOAD BACKGROUND</text><rect x="232" width="196" height="36" rx="10" fill="#153d60"/><text x="279" y="23" fill="#e7f6ff" font-size="12">UPLOAD SPRITE</text><text x="448" y="22" fill="#6e8192" font-size="11">Stored only in the current workspace</text></g>
    </g>
  </g>
</svg>
